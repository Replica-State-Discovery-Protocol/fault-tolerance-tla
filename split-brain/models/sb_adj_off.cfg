\* Electorate {1,2,3}, node 4 non-voter, partition {1,4} | {2,3}. Node 1 may
\* install {1,2,4} (two voters changed at once). Expect NoDualLeader VIOLATED.
SPECIFICATION Spec
CONSTANTS
    N = 4
    SCENARIO = "s4adj"
    Theta = 5
    ThetaR = 2
    Q = 4
    K = 1
    Delta = 1
    TRebase = 6
    MaxInc = 2
    RecBound = 5
    GATE = TRUE
    AGG = "sigma"
    TENURE = "fresh"
    CHECK_ADJ = FALSE
    CHECK_CAP = FALSE
    CHECK_SPACING = TRUE
    ALLOW_HEAL = FALSE
    TRACK_CLAIMS = FALSE
INVARIANTS
    TypeOK
    NoDualLeader
