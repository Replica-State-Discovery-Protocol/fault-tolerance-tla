\* Leader aggregated over Fresh instead of Sigma (Sect. 3.2). Partition {1} | {2,3}.
\* Expect NoDualLeader VIOLATED: {2,3} stop counting node 1 at ThetaR and
\* elect node 2 before node 1 steps down.
SPECIFICATION Spec
CONSTANTS
    N = 3
    SCENARIO = "s3cut"
    Theta = 5
    ThetaR = 2
    Q = 4
    K = 2
    Delta = 1
    TRebase = 6
    MaxInc = 2
    RecBound = 6
    GATE = TRUE
    AGG = "fresh"
    TENURE = "fresh"
    CHECK_ADJ = TRUE
    CHECK_CAP = TRUE
    CHECK_SPACING = TRUE
    ALLOW_HEAL = FALSE
    TRACK_CLAIMS = FALSE
INVARIANTS
    TypeOK
    NoDualLeader
