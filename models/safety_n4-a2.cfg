\* Safety + liveness, 4 nodes, no failures. Attempt 2: MaxClock cut 8 -> 7
\* (three heartbeat rounds at t = 2, 4, 6; Sweep still reachable since
\* Theta + TResync = 6 <= MaxClock). Run with -lncheck final.
SPECIFICATION Spec
