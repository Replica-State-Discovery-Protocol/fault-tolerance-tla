    Nodes = {n1, n2, n3, n4}
    FailNodes = {}
    UseIncarnations = FALSE
    Theta = 4
    TResync = 2
    Delta = 1
    MaxV = 2
    MaxInc = 1
    MaxClock = 7
    MaxQ = 1
    CrashWindow = 0
    RecoverWindow = 0
INVARIANTS
    TypeInvariant
    ShadowFree
PROPERTIES
    NoStaleOverwrite
    EventualAgreement
CHECK_DEADLOCK FALSE
