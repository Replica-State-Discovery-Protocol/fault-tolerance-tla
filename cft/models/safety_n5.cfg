\* Safety-only at n=5 with symmetry reduction (symmetry is unsound for
\* liveness, hence no PROPERTIES here). Table row: large-n safety.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2, n3, n4, n5}
    FailNodes = {}
    UseIncarnations = FALSE
    Theta = 4
    TResync = 2
    Delta = 1
    MaxV = 2
    MaxInc = 1
    MaxClock = 7
    MaxQ = 2
    CrashWindow = 0
    RecoverWindow = 0
INVARIANTS
    TypeInvariant
    ShadowFree
PROPERTIES
    NoStaleOverwrite
SYMMETRY NodePerms
CHECK_DEADLOCK FALSE
