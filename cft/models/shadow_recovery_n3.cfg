\* Liveness under crash-recovery, AMENDED gate: does the cluster
\* re-converge after a node recovers? Mechanizes the liveness half
\* of Theorem 2'. Run with -lncheck final.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2, n3}
    FailNodes = {n2}
    UseIncarnations = TRUE
    Theta = 4
    TResync = 2
    Delta = 1
    MaxV = 2
    MaxInc = 2
    MaxClock = 10
    MaxQ = 3
    CrashWindow = 4
    RecoverWindow = 6
INVARIANTS
    TypeInvariant
    ShadowFree
PROPERTIES
    NoStaleOverwrite
    EventualDetection
    EventualAgreement
CHECK_DEADLOCK FALSE
